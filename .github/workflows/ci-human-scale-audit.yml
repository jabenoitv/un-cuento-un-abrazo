name: Human-Scale AI & Cloud Platform Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-human-scale-and-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 1. Zero-PII & Zero-Secret Security Gate
        run: python scripts/audit_public_repo.py

      - name: 2. Human-Scale AI Core Manifest & Deterministic Suite (Stdlib)
        run: |
          python motor/motor_local_human_scale.py --auditoria-mozilla
          python -m unittest discover -s tests -v

      - name: 3. Install Cloud Control Plane & Rented-GPU Worker Package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./platform[dev]"

      - name: 4. Run Full Multi-Tenant Cloud, AES-256-GCM Vault, Corpus & PWA Suite
        working-directory: platform
        run: python -m pytest -v
